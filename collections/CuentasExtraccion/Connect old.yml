http:
  method: POST
  url: https://identity-server-homologacion.invertironline.com/connect/token
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: C-CEX
      - name: client_secret
        value: 054XPD63-N1R3-QZ6B-CUEX-8T09034BM9Y1
      - name: scope
