  forwardAuthorizationHeader: true

docs: |
  # Connect old

  Reproduce el pedido de token que hace el servicio (`IdentityModel.AspNetCore`,
  `application/x-www-form-urlencoded`) contra el host **viejo** del identity que usa el
  `appsettings` de homo: `identity-server-homologacion.invertironline.com`.

  Es el que devuelve `500 Internal Server Error`. Compararlo con **Connect sts** (host nuevo
  `identity-server-sts.homo...`, que responde 200) confirma que el servicio apunta al host roto.
