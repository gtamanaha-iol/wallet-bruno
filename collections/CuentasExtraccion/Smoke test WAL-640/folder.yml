info:
  name: Smoke test WAL-640
  type: folder
  seq: 5

request:
  scripts:
    - type: before-request
      code: |-
        // Token de la API (scope MS-CEX). Igual que en la carpeta WAL-640.
        const axios = require('axios');

        const identityUrl  = bru.getEnvVar('identityUrl');
        const clientId     = bru.getEnvVar('clientId');
        const clientSecret = bru.getEnvVar('clientSecret');

        if (!identityUrl || !clientId || !clientSecret) {
          throw new Error('[Auth] falta seleccionar un environment (Local u Homologacion)');
        }

        const body = 'grant_type=client_credentials'
                   + '&client_id=' + encodeURIComponent(clientId)
                   + '&client_secret=' + encodeURIComponent(clientSecret)
                   + '&scope=' + encodeURIComponent(bru.getEnvVar('scope'));

        const r = await axios.post(identityUrl + '/connect/token', body, {
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });

        if (!r.data.access_token) {
          throw new Error('[Auth] sin access_token: ' + JSON.stringify(r.data));
        }

        bru.setVar('accessToken', r.data.access_token);
        req.setHeader('Authorization', 'Bearer ' + r.data.access_token);

docs:
  content: |
    # Smoke test WAL-640

    Alta de una cuenta de extraccion **con segundo factor** (el flujo de nweb/BankAccount).

    - **Cliente:** 620272
    - **Identificador:** `000007650000000023834` (CVU PPay)

    ## Orden

    1. `01 - Generar codigo 2FA` — dispara el envio del codigo al cliente (User Management).
    2. `02 - Alta cuenta con 2FA` — completar `verificationCode` con el codigo recibido y enviar.

    El estado final lo decide la logica de WAL-640 segun la entidad y el valorizado.
