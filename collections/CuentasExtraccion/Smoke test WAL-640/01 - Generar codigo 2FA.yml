docs: |
  # Paso 1 — Generar y enviar el codigo 2FA

  `POST api/v1/AltaCuentaExtraccion/GenerateTwoFactorCode`

  Dispara el envio del codigo de segundo factor al cliente 620272 via User Management.

  | Campo | Enum | Valor |
  |---|---|---|
  | `iolCustomerId` | | 620272 |
  | `products` | `Product` | 1 = Alyc, 2 = Hub, 3 = Crypto |

  Cuando llegue el codigo, cargarlo en `02 - Alta cuenta con 2FA`.
