info:
  name: 00 - Estado de las cuentas de prueba
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/healthcheck"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Foto de las cuentas de la matriz, sin tocar nada. Sirve para ver el punto de
        // partida antes de correr los casos, y para comparar despues.
        const axios = require('axios');

        const ESTADO_NUM = { pendienteDeVerificacion:0, aceptada:1, rechazada:2, baja_Pendiente:3, baja:4, suspendida:5, pendienteDeAprobacionManual:6 };
        const MONEDA_NUM = { pesosArgentinos:1, dolaresUsa:2 };
        const estadoNum = e => typeof e === 'number' ? e : (ESTADO_NUM[e] ?? e);
        const monedaNum = m => typeof m === 'number' ? m : (MONEDA_NUM[m] ?? m);

        const baseUrl = bru.getEnvVar('baseUrl');
        const token   = bru.getVar('accessToken');
        const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

        const ESTADOS = {
          0: 'Pendiente', 1: 'Aceptada', 2: 'Rechazada',
          3: 'BajaPend', 4: 'Baja', 5: 'Suspendida', 6: 'AprobManual'
        };

        const CUENTAS = [
          { n: 1,  cbu: '0170340340000078881237', idCliente: 436286, entidad: 'BBVA' },  // cc: 123885
          { n: 2,  cbu: '0150501601000271781096', idCliente: 401243, entidad: 'ICBC' },  // cc: 158064
          { n: 3,  cbu: '0150889301000001071284', idCliente: 480262, entidad: 'ICBC' },  // cc: 28001
          { n: 4,  cbu: '0150519101000132838170', idCliente: 651752, entidad: 'ICBC' },  // cc: 68029
          { n: 5,  cbu: '0150902501000119142300', idCliente: 374630, entidad: 'ICBC' },  // cc: sin comitente en homo
          { n: 6,  cbu: '0150501601000022224744', idCliente: 536515, entidad: 'ICBC' },  // cc: 36261
          { n: 7,  cbu: '0000532609100002749314', idCliente: 715842, entidad: 'Ripio' }  // cc: sin comitente en homo
        ];

        // Una sola llamada por cliente, aunque tenga varias cuentas en la matriz.
        const porCliente = new Map();
        for (const c of CUENTAS) {
          if (!porCliente.has(c.idCliente)) porCliente.set(c.idCliente, null);
        }

        for (const idCliente of porCliente.keys()) {
          try {
            const r = await axios.get(
              `${baseUrl}/api/v1/CuentasExtraccion/ObtenerCuentasExtraccion/${idCliente}`,
              { headers });
            porCliente.set(idCliente, (r.data && r.data.data) || []);
          } catch (e) {
            porCliente.set(idCliente, 'ERROR');
          }
        }

        console.log(`Estado de las ${CUENTAS.length} cuentas de prueba | ${baseUrl}`);
        console.log('');
        console.log('  #  | entidad        | cbu                      | cliente   | estado');
        console.log('-----+----------------+--------------------------+-----------+---------------');

        for (const c of CUENTAS) {
          const cuentas = porCliente.get(c.idCliente);
          let estado;

          if (cuentas === 'ERROR') {
            estado = 'ERROR al listar';
          } else {
            const found = cuentas.find(x => x.numeroCbu === c.cbu);
            estado = found
              ? `${ESTADOS[found.estadoCuentaBancaria] ?? found.estadoCuentaBancaria}(${found.estadoCuentaBancaria})`
              : 'NO ESTA';
          }

          console.log(
            ` ${String(c.n).padStart(2)}  | ${c.entidad.padEnd(14)} | ` +
            `${c.cbu.padEnd(24)} | ${String(c.idCliente).padEnd(9)} | ${estado}`);
        }

        console.log('');
        console.log('"NO ESTA" = el listado del cliente no la devuelve. Puede ser que el CLEAN la haya');
        console.log('dado de baja, o que ObtenerCuentasExtraccion la filtre: el repositorio descarta las');
        console.log('filas cuyo TipoCuentaID no es un valor definido de TiposCuentaBancaria.');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Estado de las cuentas de prueba

  Foto de las 7 cuentas de la matriz de WAL-640, sin modificar nada. Conviene correrlo
  **antes** de `99 - Correr los casos` para tener el punto de partida, y despues para
  comparar. Matchea por `numeroCbu` (el `idCuenta` lo asigna el alta).

  Ojo con `NO ESTA`: ademas de una baja, puede ser el filtro de
  `CuentaExtraccionRepository.ObtenerCuentasExtraccion`, que descarta en silencio las filas
  cuyo `TipoCuentaID` no es un valor definido del enum `TiposCuentaBancaria`.
