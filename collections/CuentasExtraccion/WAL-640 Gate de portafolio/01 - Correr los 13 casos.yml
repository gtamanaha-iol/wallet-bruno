info:
  name: 01 - Correr los 13 casos
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/healthcheck"

runtime:
  scripts:
    - type: after-response
      code: |-
        // El healthcheck de arriba es solo para que Bruno tenga algo que ejecutar:
        // los 13 casos salen de este script, uno por uno via reconsulta.
        const axios = require('axios');

        const baseUrl = bru.getEnvVar('baseUrl');
        const token   = bru.getVar('accessToken');
        const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

        const ACEPTADA = 1;
        const RECHAZADA = 2;
        const MANUAL = 6;

        const ESTADOS = {
          0: 'Pendiente', 1: 'Aceptada', 2: 'Rechazada',
          3: 'BajaPend', 4: 'Baja', 5: 'Suspendida', 6: 'AprobManual'
        };

        // Datos verificados contra IOL2 homo el 2026-08-20. El valorizado es el de esa
        // corrida (MEP 1535,09): los saldos se mueven, asi que si un caso no da lo
        // esperado, revalidar con "02 - Valorizado de un cliente" antes de culpar al gate.
        const CASOS = [
          { n: 1,  idCuenta: 614068,   idCliente: 505258,  entidad: 'Galicia (CBU)',   esperado: ACEPTADA,  cubre: 'banco comun -> aprueba SIN consultar valorizado' },
          { n: 2,  idCuenta: 613911,   idCliente: 1195589, entidad: 'ICBC',            esperado: ACEPTADA,  cubre: 'ICBC bajo el umbral (146.831) -> APRUEBA' },
          { n: 3,  idCuenta: 613964,   idCliente: 1035817, entidad: 'ICBC',            esperado: MANUAL,    cubre: 'ICBC sobre el umbral (5.529.552) -> pendiente' },
          { n: 4,  idCuenta: 612400,   idCliente: 1189924, entidad: 'Wilobank',        esperado: ACEPTADA,  cubre: 'Wilobank bajo el umbral (341.713) -> APRUEBA' },
          { n: 5,  idCuenta: 611661,   idCliente: 104310,  entidad: 'Wilobank',        esperado: MANUAL,    cubre: 'Wilobank sobre el umbral (47.790.425) -> pendiente' },
          { n: 6,  idCuenta: 613989,   idCliente: 617764,  entidad: 'ICBC',            esperado: ACEPTADA,  cubre: 'valorizado NEGATIVO (-149.989) -> aprueba (item abierto)' },
          { n: 7,  idCuenta: 61464121, idCliente: 1201112, entidad: 'ICBC',            esperado: ACEPTADA,  cubre: 'valorizado CERO, cuenta ya en 6 por WAL-820 -> APRUEBA' },
          { n: 8,  idCuenta: 614599,   idCliente: 1197453, entidad: 'ICBC',            esperado: MANUAL,    cubre: 'FAIL-SAFE: el leg ARS devuelve 500 -> pendiente' },
          { n: 9,  idCuenta: 613910,   idCliente: 1195589, entidad: 'ICBC',            esperado: RECHAZADA, cubre: 'la IDENTIDAD manda: CUIT no matchea, valorizado bajo' },
          { n: 10, idCuenta: 613209,   idCliente: 1193358, entidad: 'PPay (CVU)',      esperado: MANUAL,    cubre: 'CVU nunca se auto-aprueba' },
          { n: 11, idCuenta: 396427,   idCliente: 979714,  entidad: 'Uala (CVU)',      esperado: MANUAL,    cubre: 'CVU fuera del dominio del gate (el 1->6 es de WAL-820)' },
          { n: 12, idCuenta: 384774,   idCliente: 949925,  entidad: 'MercadoLibre',    esperado: ACEPTADA,  cubre: 'CVU de entidad estandar -> aprueba' },
          { n: 13, idCuenta: 61464104, idCliente: 1201113, entidad: 'Ripio (CVU)',     esperado: RECHAZADA, cubre: 'CVU fuera de la whitelist -> rechaza' }
        ];

        const estadoDe = async (idCliente, idCuenta) => {
          const r = await axios.get(
            `${baseUrl}/api/v1/CuentasExtraccion/ObtenerCuentasExtraccion/${idCliente}`,
            { headers });
          const c = ((r.data && r.data.data) || []).find(x => x.idCuenta === idCuenta);
          return c ? c.estadoCuentaBancaria : null;
        };

        console.log(`WAL-640 | 13 casos contra ${baseUrl}`);
        console.log('');

        const filas = [];
        let ok = 0, fallidos = 0, errores = 0;

        for (const c of CASOS) {
          let antes = null, despues = null, detalle = '', nota = '';

          try {
            antes = await estadoDe(c.idCliente, c.idCuenta);

            const r = await axios.post(
              `${baseUrl}/api/v1/CuentasExtraccion/ReconsultaCuentaExtraccion/${c.idCuenta}`,
              {}, { headers });

            const d = (r.data && r.data.data) || {};
            detalle = d.detalleResultadoValidacion || '';

            despues = await estadoDe(c.idCliente, c.idCuenta);

            // Si el proveedor no resolvio el CBU, la reconsulta ni siquiera llega al gate:
            // se marca aparte para no leerlo como una falla del gate.
            if (despues === antes && antes !== c.esperado && /error|no pudimos|timeout/i.test(detalle)) {
              nota = 'BIND no resolvio: el gate no se ejercito';
            }
          } catch (e) {
            errores++;
            const msg = e.response ? `${e.response.status} ${JSON.stringify(e.response.data)}` : e.message;
            filas.push({ n: c.n, entidad: c.entidad, antes, despues: 'ERROR', esperado: c.esperado, res: 'ERR', cubre: c.cubre, nota: msg });
            continue;
          }

          const paso = despues === c.esperado;
          paso ? ok++ : fallidos++;

          filas.push({
            n: c.n, entidad: c.entidad, antes, despues, esperado: c.esperado,
            res: paso ? 'OK' : 'FALLA', cubre: c.cubre,
            nota: nota || (detalle ? detalle.slice(0, 60) : '')
          });
        }

        const est = v => v === null ? '-' : `${ESTADOS[v] ?? v}(${v})`;

        console.log('  #  | entidad        | antes         | despues       | esperado      | res');
        console.log('-----+----------------+---------------+---------------+---------------+------');
        for (const f of filas) {
          console.log(
            ` ${String(f.n).padStart(2)}  | ${f.entidad.padEnd(14)} | ${est(f.antes).padEnd(13)} | ` +
            `${est(f.despues).padEnd(13)} | ${est(f.esperado).padEnd(13)} | ${f.res}`);
        }

        console.log('');
        console.log('Detalle por caso:');
        for (const f of filas) {
          console.log(` ${String(f.n).padStart(2)}. ${f.cubre}`);
          if (f.nota) console.log(`     ${f.nota}`);
        }

        console.log('');
        console.log(`RESULTADO: ${ok} OK | ${fallidos} FALLA | ${errores} ERROR  (de ${CASOS.length})`);

        bru.setVar('casosOk', ok);
        bru.setVar('casosFallidos', fallidos + errores);

  assertions:
    - expression: bru.getVar("casosFallidos")
      operator: eq
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Correr los 13 casos

  Dispara los 13 casos de WAL-640 via `ReconsultaCuentaExtraccion` y arma una tabla con el
  estado **antes**, **despues** y el **esperado** de cada cuenta.

  El detalle de que cubre cada caso, con el valorizado de cada cliente desglosado leg por
  leg, esta en
  `MO.API.CuentasExtraccion/local_docs/features/wal-640-aprobacion-automatica/09-casos-de-prueba-homo.md`.

  ## Como leer el resultado

  - **OK** — el estado quedo en el esperado.
  - **FALLA** — quedo en otro. Si la nota dice *"BIND no resolvio"*, el gate ni siquiera
    se ejercito: la reconsulta con `EndpointApi` pasa `rechazarSiFalla: false`, asi que una
    falla del proveedor cae en `ErrorValidacionBind` y deja la cuenta como estaba. Eso no es
    un bug del gate.
  - **ERROR** — el request fallo (token, red, 500).

  ## Los casos no son independientes entre corridas

  Los casos 2, 4, 6, 7 y 12 **mueven la cuenta a `Aceptada`**. En la segunda corrida el
  "antes" ya va a ser `Aceptada`, y el resultado esperado sigue siendo el mismo, asi que la
  prueba sigue siendo valida — pero deja de probar la *transicion*.

  Para volver a ver la transicion desde `PendienteDeAprobacionManual`, hay que devolver esas
  cuentas a estado `6`, y eso **el CLEAN no lo hace** (las manda a `Baja`). Requiere SQL
  directo:

  ```sql
  UPDATE tcl_cuenta_retiro
  SET ID_Estado_Cuenta = 6
  WHERE ID_Cuenta IN (613911, 612400, 613989, 61464121);
  ```

  ## Valorizado desactualizado

  Los importes de los comentarios de cada caso son de la corrida del 2026-08-20 (MEP
  1.535,09). Los saldos y el portafolio se mueven. Si un caso de umbral falla, revalidar con
  `02 - Valorizado de un cliente` antes de culpar al gate: puede que el cliente haya cruzado
  el millon.
