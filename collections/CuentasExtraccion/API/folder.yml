info:
  name: API
  type: folder
  seq: 1

request:
  auth: none
  scripts:
    - type: before-request
      code: |-
        // Token (client_credentials, scope MS-CEX).
        // Todos los controllers de MO.API.CuentasExtraccion tienen [Authorize], asi que
        // sin token no anda ninguno. El scope que valida el servicio sale de
        // ApiIdentityServerConfig.RequiredScopes en su appsettings.
        // Los envs local y homo usan el mismo identity y el mismo client: las cuentas de
        // prueba son datos de la base de homo, asi que la API local tiene que levantarse
        // con ASPNETCORE_ENVIRONMENT=HOMOLOGACION.
        const identityUrl  = bru.getEnvVar('identityUrl');
        const clientId     = bru.getEnvVar('clientId');
        const clientSecret = bru.getEnvVar('clientSecret');
        const scope        = bru.getEnvVar('scope');

        if (!identityUrl || !clientId || !clientSecret) {
          throw new Error('[Auth] falta seleccionar un environment (Local u Homologacion)');
        }

        const axios = require('axios');
        const tokenBody = 'grant_type=client_credentials'
                        + '&client_id=' + encodeURIComponent(clientId)
                        + '&client_secret=' + encodeURIComponent(clientSecret)
                        + '&scope=' + encodeURIComponent(scope);

        const tokenRes = await axios.post(identityUrl + '/connect/token', tokenBody, {
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });

        if (!tokenRes.data.access_token) {
          throw new Error('[Auth] sin access_token: ' + JSON.stringify(tokenRes.data));
        }

        // Se guarda ademas en variable para los scripts que disparan pedidos con axios.
        bru.setVar('accessToken', tokenRes.data.access_token);
        req.setHeader('Authorization', 'Bearer ' + tokenRes.data.access_token);

docs: |
  # API

  Los requests base de `MO.API.CuentasExtraccion`, para usar sueltos.

  El token se pide una vez por request en el `before-request` de esta carpeta.
  Si devuelve `invalid_scope`, al client de pruebas le falta el scope **MS-CEX**
  habilitado en el identity de homologacion.
