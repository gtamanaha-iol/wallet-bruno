name: Homologacion

variables:
  - name: baseUrl
    value: https://cashout-api.app.homo.invertironline.com
  # WAL-846: los 3 casos apuntan a una instancia fija cada uno, sin depender de
  # que environment este seleccionado.
  - name: baseUrlLocal
    value: http://localhost:5002
  - name: baseUrlHomo
    value: https://cashout-api.app.homo.invertironline.com
  - name: identityUrl
    value: https://identity-server-homologacion.invertironline.com
  - name: clientId
    value: MS-CASHOUT
  # Completar. Si el client MS-CASHOUT no esta a mano, se puede usar el client
  # de pruebas GT-TEST (el mismo de la coleccion CashIn), siempre que tenga
  # habilitado el scope MS-CASHOUT en el identity de homologacion.
  - name: clientSecret
    value: ""
  - name: scope
    value: MS-CASHOUT
