name: Homologacion

variables:
  - name: baseUrl
    value: https://cashout-api.app.homo.invertironline.com
  # WAL-846: los 3 casos apuntan a una instancia fija cada uno, sin depender de
  # que environment este seleccionado.
  - name: baseUrlLocal
    value: http://localhost:5002
  - name: baseUrlHomo
    value: https://cashout-api.app.homo.invertironline.com
  # Es el Authority que valida la API (`ApiIdentityServerConfig` del appsettings de
  # homo). El identity viejo (identity-server-homologacion) tambien emite un token
  # valido, pero este es el que corresponde.
  - name: identityUrl
    value: https://identity-server-sts.homo.invertironline.com
  # El client `MS-CASHOUT` del appsettings NO sirve para pedir token: el STS de homo
  # responde `invalid_client`. El que funciona es el del listener, verificado el
  # 2026-09-18.
  - name: clientId
    value: C-CASHOUT-LISTENER-KAFKA
  - name: clientSecret
    value: 8d16cecb-4e60-04c6-5468-d2920bcf93c7
  - name: scope
    value: MS-CASHOUT
