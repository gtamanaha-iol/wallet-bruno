info:
  name: 03 - Filtro por estado
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/usa-withdrawals?status=fundsHeld&status=dispatched&from={{usaFrom}}&to={{usaTo}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  postResponse: |
    const items = res.body?.items ?? [];
    console.log('total =', res.body?.total, '| estados =', [...new Set(items.map(i => i.status))]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # 03 — Filtro por estado (cola de pendientes)

  Iniciadas + En proceso. `status` se repite en la query; los valores válidos son los
  del enum `WithdrawalStatus` (nombre en camelCase): `fundsHeld`, `dispatched`, `settled`, `cancelled`.

  Usa el índice `IX_Tcl_Cuenta_Movim_Extraccion_USA_Estado` (seek por estado).

  ## Esperado

  - HTTP 200, todos los `items` con `status` `fundsHeld` o `dispatched`.
  - `total` = suma de las extracciones de esos dos estados (el service suma los conteos
    de `GetStatusSummaryAsync` para los estados filtrados).
  - Con un valor inválido (`status=foo`): 400.
