docs: |
  # 07 — En proceso → Confirmada

  ⏳ **Hoy responde 500** (`UpdateStatusAsync` sin implementar). Queda armado para el
  ticket del service, que lo conecta con `ConfirmWithdrawalAsync`.

  ## Esperado (una vez conectado)

  - 204. En la base: estado 6 (SETTLED), `HechoXXX = 1`, `Saldcuen` baja el monto una sola
    vez y se genera el boleto (`tcl_boleto_movimiento_fondo`).
  - Repetirlo: 409 y **no** vuelve a debitar.
  - Desde Iniciada (sin pasar por 06): 409.
