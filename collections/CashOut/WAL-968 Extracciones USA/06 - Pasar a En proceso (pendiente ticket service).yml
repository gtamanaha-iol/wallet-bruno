docs: |
  # 06 — Iniciada → En proceso

  ⏳ **Hoy responde 500** (`UpdateStatusAsync` sin implementar). Queda armado para el
  ticket del service, que lo conecta con `MarkInTransitAsync`.

  `X-Client-Id: C-IOL-BACKOFFICE` es el client privilegiado de `UsaWithdrawalOptions`
  (el backoffice puede cambiar a cualquier estado). `usaWithdrawalId` lo dejan el 01 o el 05.

  ## Esperado (una vez conectado)

  - 204. En la base: estado 3 (DISPATCHED) y `FechaEnTransito` cargada; `HechoXXX` sigue en 0.
  - Repetirlo: 409 (ya no está en Iniciada).
