http:
  method: POST
  url: "{{baseUrl}}/api/v1/ExtraccionAutomatica/Extraer"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "idCliente": 392836,
        "tipoCuenta": 1,
        "tipoExtraccion": 2,
        "importe": 1.0,
        "idCuentaBancariaDelClienteDestino": 71768
      }

runtime:
  assertions:
