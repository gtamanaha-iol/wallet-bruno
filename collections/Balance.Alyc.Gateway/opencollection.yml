opencollection: 1.0.0

info:
  name: Balance.Alyc.Gateway
request:
  scripts:
    - type: before-request
      code: |
        const trustedServiceBaseUrl = bru.getEnvVar('trustedServiceBaseUrl');
        const resolvedUrl = req.url.replace(/\{\{(\w+)\}\}/g, (_, name) => bru.getEnvVar(name) || bru.getVar(name) || '');
        if (trustedServiceBaseUrl && resolvedUrl.startsWith(trustedServiceBaseUrl)) {
          return;
        }

        const clientId = bru.getEnvVar('clientId');
        const clientSecret = bru.getEnvVar('clientSecret');
        const identityServerUrl = bru.getEnvVar('identityServerUrl');

        const axios = require('axios');
        const body = `grant_type=client_credentials&client_id=${clientId}&client_secret=${clientSecret}&scope=balance-alyc.all`;

        const response = await axios.post(`${identityServerUrl}/connect/token`, body, {
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });

        if (response.data.access_token) {
          bru.setEnvVar('token', response.data.access_token);
          req.setHeader('Authorization', 'Bearer ' + response.data.access_token);
        } else {
          console.error('[Auth] Failed to get token:', JSON.stringify(response.data));
        }

bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
