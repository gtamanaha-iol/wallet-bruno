info:
  name: List Accounts by Status
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/international-bank-account/status/{{status}}"
  auth: bearer

auth:
  bearer:
    token: "{{token}}"

params:
  query:
    - name: Page
      value: "1"
      enabled: true
    - name: PageSize
      value: "20"
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
