info:
  name: Update Account Status
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/international-bank-account/{{bankAccountId}}/status"
  auth: bearer
  body:
    type: json
    data: |
      {
        "newStatus": "Accepted",
        "changedBy": 0,
        "observation": null
      }

auth:
  bearer:
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
