info:
  name: 07 - v2 Export Excel
  type: http
  seq: 7

http:
  method: GET
  url: "{{activitiesBaseUrl}}/api/v2/clients/{{clientUsa}}/movements/export?movementType=extraction&country=usa&currency=USD&startDate={{startDate}}&endDate={{endDate}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Exportación a Excel con los mismos filtros. Usa el mismo listado, así que tiene que incluir las USA.
