info:
  name: 03 - v1 Extracciones todas las cuentas (ARG + USA)
  type: http
  seq: 3

http:
  method: GET
  url: "{{activitiesBaseUrl}}/api/clients/{{clientArgYUsa}}/movements?movementType=extraction&startDate={{startDate}}&endDate={{endDate}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Sin filtro de cuenta: corre la consulta ARG y la USA en paralelo y las mezcla ordenadas por fecha.

  **Esperado (cliente 887257):** las extracciones ARG de siempre + 5 USA, sin ids repetidos.
