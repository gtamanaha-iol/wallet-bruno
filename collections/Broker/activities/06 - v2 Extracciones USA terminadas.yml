info:
  name: 06 - v2 Extracciones USA terminadas
  type: http
  seq: 6

http:
  method: GET
  url: "{{activitiesBaseUrl}}/api/v2/clients/{{clientUsa}}/movements?movementType=extraction&country=usa&currency=USD&state=confirmed&startDate={{startDate}}&endDate={{endDate}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Filtro de estado: `confirmed` → `HechoXXX = 1`. Otros valores: `pending` (0), `rejected_or_canceled` (2), `all`.

  **Esperado:** solo las USA terminadas (61232428, 61232429, 61232452, 61232456, 62358502).
