info:
  name: 02 - v1 Extracciones USA (solo USA)
  type: http
  seq: 2

http:
  method: GET
  url: "{{activitiesBaseUrl}}/api/clients/{{clientUsa}}/movements?movementType=extraction&country=usa&currency=USD&startDate={{startDate}}&endDate={{endDate}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Lo que pide la nweb (`GET /Activities` del Gateway → v1). Cuenta USA (`usa` + `USD` → tipo 3).

  **Esperado:** 9 extracciones USA del cliente 537401 (por ej. 61232456 terminada con boleto 1353548, 61232457 cancelada, 62358502).
