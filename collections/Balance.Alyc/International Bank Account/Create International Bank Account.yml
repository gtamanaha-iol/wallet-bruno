info:
  name: Create International Bank Account
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/international-bank-accounts"
  body:
    type: json
    data: |-
      {
        "clientId": 436286, // ATO: 436286 - 537401
        "accountHolderName": "Account with ATO",
        "bankAccountNumber": "0071234567814",
        "currencyId": 2,
        "bankId": 2,
        "isFavorite": false,
        "bankCode": "026009593",
        "bankCodeType": "Aba",
        "accountStatementUrl": "https://pdfplaceholder.com/pdf/Estado+de+cuenta"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
