info:
  name: "03 - Error Cases (expect 401)"
  type: folder
  seq: 3

request:
  auth: none
  scripts:
    - type: before-request
      code: "const CryptoJS = require('crypto-js');\nconst mode = bru.getVar('errorMode');\nconst secret = bru.getEnvVar('trustedServiceSecret');\nconst now = Math.floor(Date.now() / 1000);\nconst rawUrl = req.url.replace(/\\{\\{(\\w+)\\}\\}/g, (_, name) => bru.getEnvVar(name) || bru.getVar(name) || '');\nconst pathStart = rawUrl.indexOf('/', rawUrl.indexOf('//') + 2);\nconst requestPath = pathStart !== -1 ? rawUrl.slice(pathStart) : '/';\nconst emptyBodyHash = CryptoJS.SHA256('').toString(CryptoJS.enc.Hex);\nfunction sign(ts, path, bodyHash, key) {\n  const msg = req.method.toUpperCase() + path + bodyHash + ts;\n  return CryptoJS.HmacSHA256(msg, key).toString(CryptoJS.enc.Base64);\n}\nif (mode === 'solo-timestamp') {\n  req.setHeader('X-IOL-Timestamp', now.toString());\n} else if (mode === 'solo-signature') {\n  req.setHeader('X-IOL-Signature', 'dGhpc2lzYW5vdHJlYWxzaWduYXR1cmU=');\n} else if (mode === 'expired-timestamp') {\n  const ts = (now - 120).toString();\n  req.setHeader('X-IOL-Timestamp', ts);\n  req.setHeader('X-IOL-Signature', sign(ts, requestPath, emptyBodyHash, secret));\n} else if (mode === 'future-timestamp') {\n  const ts = (now + 120).toString();\n  req.setHeader('X-IOL-Timestamp', ts);\n  req.setHeader('X-IOL-Signature', sign(ts, requestPath, emptyBodyHash, secret));\n} else if (mode === 'invalid-timestamp') {\n  req.setHeader('X-IOL-Timestamp', 'no-es-unix-timestamp');\n  req.setHeader('X-IOL-Signature', 'dGhpc2lzYW5vdHJlYWxzaWduYXR1cmU=');\n} else if (mode === 'invalid-base64') {\n  req.setHeader('X-IOL-Timestamp', now.toString());\n  req.setHeader('X-IOL-Signature', '!!!esto-no-es-base64-valido!!!');\n} else if (mode === 'wrong-secret') {\n  const ts = now.toString();\n  req.setHeader('X-IOL-Timestamp', ts);\n  req.setHeader('X-IOL-Signature', sign(ts, requestPath, emptyBodyHash, 'secreto-equivocado-que-no-coincide'));\n} else if (mode === 'tampered-body') {\n  const ts = now.toString();\n  const fakeBodyHash = CryptoJS.SHA256('{\"clientId\": 99999, \"amount\": 9999.99}').toString(CryptoJS.enc.Hex);\n  req.setHeader('X-IOL-Timestamp', ts);\n  req.setHeader('X-IOL-Signature', sign(ts, requestPath, fakeBodyHash, secret));\n} else if (mode === 'tampered-path') {\n  const ts = now.toString();\n  req.setHeader('X-IOL-Timestamp', ts);\n  req.setHeader('X-IOL-Signature', sign(ts, '/api/v1/wrong-path', emptyBodyHash, secret));\n}"
