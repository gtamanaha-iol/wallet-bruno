info:
  name: "Firma Base64 invalida -> 401"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/international-bank-accounts/{{bankAccountId}}"
  auth: none

vars:
  - name: errorMode
    value: invalid-base64
    local: true

assert:
  - expr: res.status
    assert: eq 401

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
