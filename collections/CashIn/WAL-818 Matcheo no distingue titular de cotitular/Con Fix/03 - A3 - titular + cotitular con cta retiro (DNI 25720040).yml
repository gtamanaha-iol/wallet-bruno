info:
  name: "03 - A3 - titular + cotitular con cta retiro (DNI 25720040)"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "Dni": "25720040",
        "Comprobante": "WAL818-CONFIX-A3-{{$timestamp}}",
        "Importe": 1003.03,
        "Referencia": "VARVarios",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,
        "Moneda": 1,
        "TipoDepositoFondo": 3,
        "TipoMovimiento": 1,
        "EstadoOperacion": 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL818",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }

# forma (a) + CC repetida, CC dormidas. Candidatas: CC 15059 titular (2014-05), CC 75869 cotitular Y cta-retiro (2019-10). SIN FIX: CuentaMasNueva -> 75869. CON FIX: TitularCC -> 15059.
#
# Se acredita en los dos escenarios; lo que cambia es EN QUE CC.
# Verificar con verify-homo.sql.
assert:
  - expr: res.status
    assert: eq 200
  - expr: res.body.responseType
    assert: eq success

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
