info:
  name: "2 - Informe de B"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Depositos/ConfirmarInformeDeposito"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "ID": 0,
        "IdCliente": 1017747, // DNI: 21391818, CC: 414843
        "Importe": {{importeRankingCompleto}},
        "IdMoneda": 1,
        "IdBancoOrigen": 11,
        "IdBancoDestino": 27,
        "BancoDestinoSucursal": "",
        "Fecha": "{{fechaInforme}}",
        "NroComprobante": "806{{$timestamp}}",
        "IdTipoCuenta": 1,
        "IdCuentaDestino": 1,
        "Cbu": "0170099900000000000017",
        "CuitCuil": "",
        "IdTipoDeposito": 3
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Paso 2/4. B carga el suyo, mismo importe. Los dos quedan pendientes ANTES de que nadie transfiera.
  B es titular de la cuenta de retiro donde A figura como cotitular (par 1, ya verificado):
  eso es lo que hace que el deposito de A pueda ver tambien el informe de B como candidato.
