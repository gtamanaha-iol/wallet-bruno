info:
  name: "3 - Deposito de B - su informe sigue disponible"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "Dni": "21391818", // B, el que cargo el informe del paso 1. CC: 414843
        "Comprobante": "WAL806-R{{runId}}-C1B-{{$timestamp}}",
        "Importe": {{importeCruce}},
        "Referencia": "",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,
        "Moneda": 1,
        "TipoDepositoFondo": 3,
        "TipoMovimiento": 1,
        "EstadoOperacion": 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL806",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

docs: |
  Paso 3/3. La otra mitad del fix: el informe de B no se quemo en el paso 2, sigue pendiente
  y ahora lo consume su dueño.

  ESPERADO: matchea el informe del paso 1 -> acredita en la CC 414843 de B y lo consume.

  SIN FIX este paso no tenia nada que matchear (el deposito de A ya se habia comido el
  informe) y el deposito de B caia al metodo 2 con un deposito espejo.
