info:
  name: "2 - Deposito de A - SE CRUZA"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "Dni": "23153715", // CC: 341121
        "Comprobante": "WAL806-R{{runId}}-C9A-{{$timestamp}}",
        "Importe": {{importeCruce}},
        "Referencia": "",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,
        "Moneda": 1,
        "TipoDepositoFondo": 3,
        "TipoMovimiento": 1,
        "EstadoOperacion": 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL806",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Paso 2/3. ACA FALLA. A transfiere su plata, pero no tiene informe propio.
  El unico candidato es el informe de B (entra por cotitular de cuenta bancaria).

  SIN FIX: lo toma -> la plata de A se acredita en la CC 414843 de B. Nota vacia.
  CON FIX: lo descarta por identidad -> metodo 2 -> CC 341121 de A + deposito espejo.

  A diferencia de los escenarios 4 y 8, aca no hay dos candidatos compitiendo, asi que
  el resultado sin fix no depende del orden que devuelva el SP: falla siempre.
