info:
  name: "1 - Informe de B (el cotitular)"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Depositos/ConfirmarInformeDeposito"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "ID": 0,
        "IdCliente": 1017747, // DNI: 21391818, CC: 414843
        "Importe": {{importeCruce}},
        "IdMoneda": 1,
        "IdBancoOrigen": 11,
        "IdBancoDestino": 27,
        "BancoDestinoSucursal": "",
        "Fecha": "{{fechaInforme}}",
        "NroComprobante": "806{{$timestamp}}",
        "IdTipoCuenta": 1,
        "IdCuentaDestino": 1,
        "Cbu": "0170099900000000000017",
        "CuitCuil": "",
        "IdTipoDeposito": 3
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Paso 1/3. B carga su informe. Es el UNICO informe pendiente por este importe:
  A no carga ninguno, y eso es lo que hace que el fallo sea garantizado.

  Con un solo candidato no hay lotería de orden: el metodo 1 lo devuelve siempre.
