info:
  name: "1 - Informe del titular de la CC"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Depositos/ConfirmarInformeDeposito"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "ID": 0,
        "IdCliente": 1171725, // DNI: 16355646, CC: 404420, un unico cotitular en la CC
        "Importe": {{importeCotitularCC}},
        "IdMoneda": 1,
        "IdBancoOrigen": 11,
        "IdBancoDestino": 27,
        "BancoDestinoSucursal": "",
        "Fecha": "{{fechaInforme}}",
        "NroComprobante": "806{{$timestamp}}",
        "IdTipoCuenta": 1,
        "IdCuentaDestino": 1,
        "Cbu": "0170099900000000000017",
        "CuitCuil": "",
        "IdTipoDeposito": 3
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

docs: |
  Paso 1/2. El titular de la CC 404420 carga su informe. En Tcl_Cliente_Cotitular tiene
  un unico cotitular, DNI 38136819, que es quien va a transferir en el paso 2.

  El SP lo trae por su fuente 2 (tcl_cotitular), y la columna CUITCotitular del resultado
  devuelve ese DNI. Es el dato con el que el selector reconoce el vinculo.
