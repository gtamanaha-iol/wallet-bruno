info:
  name: "2 - Deposito del cotitular de la CC"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "Dni": "38136819", // cotitular de la CC 404420, no es cliente el mismo
        "Comprobante": "WAL806-R{{runId}}-C4-{{$timestamp}}",
        "Importe": {{importeCotitularCC}},
        "Referencia": "",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,
        "Moneda": 1,
        "TipoDepositoFondo": 3,
        "TipoMovimiento": 1,
        "EstadoOperacion": 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL806",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

docs: |
  Paso 2/2. Transfiere el cotitular de la cuenta comitente. Es un flujo LEGITIMO: un
  cotitular puede fondear la CC de la que es cotitular, y el fix lo tiene que preservar.

  ESPERADO: matchea el informe del paso 1 -> acredita en la CC 404420 y consume el informe.

  El DNI del cotitular no pertenece a ningun cliente, asi que si el descarte se pasara de
  estricto el deposito no tendria a donde caer por el metodo 2 y quedaria pendiente: la
  diferencia se ve sin ambiguedad.
