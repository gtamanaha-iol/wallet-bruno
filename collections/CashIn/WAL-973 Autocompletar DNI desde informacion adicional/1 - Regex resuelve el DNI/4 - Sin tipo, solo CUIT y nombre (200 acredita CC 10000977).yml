info:
  name: "4 - Sin tipo, solo CUIT y nombre (200 acredita CC 10000977)"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "Dni": "",
        "Comprobante": "WAL973-R{{runId}}-NOTIPO-{{$timestamp}}",
        "Importe": {{importe_sinTipo}},
        "Referencia": "",
        "InformacionAdicional": "Datos Adicionales:{20398105002 PEREZ JUAN TEST; REF: APCCAPITAL;};",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,
        "Moneda": 1,
        "TipoDepositoFondo": 3,
        "TipoMovimiento": 1,
        "EstadoOperacion": 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL973",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Formato sin TIPO: el CUIT va justo despues de "Datos Adicionales:{" (es el formato de las
  filas cargadas a mano en la tabla de homo). Esperado: Dni 39810500 -> CC 10000977.
