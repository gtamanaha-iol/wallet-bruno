info:
  name: "1 - PROVEEDORES con CUIT de persona (200 acredita CC 10000977)"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  body:
    type: json
    data: |-
      {
        "Dni": "",
        "Comprobante": "WAL973-R{{runId}}-PROV-{{$timestamp}}",
        "Importe": {{importe_proveedores}},
        "Referencia": "",
        "InformacionAdicional": "Datos Adicionales:{PROVEEDORES;20398105002 PEREZ JUAN TEST;;};",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,            // Inversion = 1,
        "Moneda": 1,                // Peso_Argentino = 1, Dolar_Estadounidense = 2,
        "TipoDepositoFondo": 3,    // TRANSFERENCIA_ELECTRONICA = 3,
        "TipoMovimiento": 1,       // Credito = 1, 
        "EstadoOperacion": 1,      // PENDIENTE = 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL973",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: success

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |
  El banco manda el Dni VACIO y el CUIT 20398105002 solo viaja dentro de InformacionAdicional.

  CON FIX: la regex extrae el CUIT, valida el digito verificador y toma los 8 del medio
  -> Dni 39810500 -> cuenta comitente 10000977 -> se acredita.
  SIN FIX: el Dni queda vacio -> 400 "El numero de documento del ordenante debe ser mayor a 0".

  Verificar (ver README): audit_logs.modified_movement->>'Dni' = 39810500 y
  cash_in_matching_resolution_count{dni_source="additional_info_regex"}.
