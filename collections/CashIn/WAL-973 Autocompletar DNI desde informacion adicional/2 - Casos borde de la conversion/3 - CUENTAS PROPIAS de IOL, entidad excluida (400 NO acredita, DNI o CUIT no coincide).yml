info:
  name: "3 - CUENTAS PROPIAS de IOL, entidad excluida (400 NO acredita, DNI o CUIT no coincide)"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "Dni": "",
        "Comprobante": "WAL973-R{{runId}}-IOL-{{$timestamp}}",
        "Importe": {{importe_entidadExcluida}},
        "Referencia": "",
        "InformacionAdicional": "Datos Adicionales:{CUENTAS PROPIAS;33707852459 INVERTIRONLINE S.A.U.;;};",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,
        "Moneda": 1,
        "TipoDepositoFondo": 3,
        "TipoMovimiento": 1,
        "EstadoOperacion": 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL973",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.responseType
      operator: eq
      value: "invalidRequest"
    - expression: res.body.message
      operator: contains
      value: "no coincide con Cuenta Comitente"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  CUIT de IOL (33-70785245-9): el Dni resultante es 70785245, que esta en la lista de entidades
  excluidas (ByMA, MAV, IOL, Cordial). Es el mismo valor fijo que hoy pone el webtool a mano.

  Esperado: 400 "DNI/CUIT no coincide con Cuenta Comitente". El deposito NO se acredita a
  ningun cliente: el Dni se completa (70785245) pero IOL es entidad excluida, el movimiento
  queda RechazadoFinalizado y sin cuenta comitente, y FondearCuenta responde ese 400.
  La resolucion de la metrica es excluded_entity.

  Confirmado en homo: devuelve 400 con ese mensaje (no 200 como se habia supuesto).
