info:
  name: "2 - Empresa con CUIT 30 (200 acredita CC 10001302)"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "Dni": "",
        "Comprobante": "WAL973-R{{runId}}-EMPR-{{$timestamp}}",
        "Importe": {{importe_empresa}},
        "Referencia": "",
        "InformacionAdicional": "Datos Adicionales:{PROVEEDORES;30590360763 EMPRESA TEST SRL;;};",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,
        "Moneda": 1,
        "TipoDepositoFondo": 3,
        "TipoMovimiento": 1,
        "EstadoOperacion": 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL973",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Empresa: CUIT 30-59036076-3. Se convierte igual que una persona (los 8 del medio), como hoy
  cuando el banco manda el CUIT: Dni 59036076 -> NumeDocu de la empresa en IOL2
  -> CC 10001302 (cliente 1200766).
  Esperado: acreditado.
