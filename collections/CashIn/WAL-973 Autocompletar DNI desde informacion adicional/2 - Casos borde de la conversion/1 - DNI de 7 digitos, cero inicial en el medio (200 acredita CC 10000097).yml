info:
  name: "1 - DNI de 7 digitos, cero inicial en el medio (200 acredita CC 10000097)"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1.0/Fondos/DepositarMovimientoRecaudadora"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "Dni": "",
        "Comprobante": "WAL973-R{{runId}}-DNI7-{{$timestamp}}",
        "Importe": {{importe_sieteDigitos}},
        "Referencia": "",
        "InformacionAdicional": "Datos Adicionales:{PROVEEDORES;20077677276 GOMEZ MARIA TEST;;};",
        "IdRecaudadora": 1,
        "Pais": 54,
        "TipoCuenta": 1,
        "Moneda": 1,
        "TipoDepositoFondo": 3,
        "TipoMovimiento": 1,
        "EstadoOperacion": 1,
        "FechaMovimiento": "{{$isoTimestamp}}",
        "FechaTransferencia": "{{$isoTimestamp}}",
        "ConceptoOperacion": "Credito por Transferencia",
        "NombreOrdenante": "TEST WAL973",
        "CuentaBancariaDestino": { "CBU": "0270100010036331160017" },
        "CuentaBancariaOrigen": { "CBU": "0170099900000000000017" }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.responseType
      operator: eq
      value: "success"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  CUIT 20-07767727-6: los 8 del medio son "07767727". La conversion saca el cero inicial
  (TrimStart('0')) -> Dni 7767727 (7 digitos, valido para ValidarMovimiento, que acepta 6 a 8).
  Es la misma conversion que hace CashinBindApi cuando el banco manda el CUIT.
  Esperado: CC 10000097, acreditado.
